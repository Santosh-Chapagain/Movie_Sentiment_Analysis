<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #222;
        background: #ffffff;
    }

    .shell {
        width: 90%;
        max-width: 900px;
        margin: 0 auto;
        padding: 30px 0;
    }

    .hero {
        margin-bottom: 25px;
    }

    .eyebrow {
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        color: #222;
    }

    .subtitle {
        max-width: 700px;
        margin: 8px 0 0;
        color: #666;
        line-height: 1.5;
        font-size: 13px;
    }

    .grid {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr;
        gap: 20px;
    }

    .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 14px;
    }

    textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        color: #222;
        padding: 10px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        outline: none;
    }

    textarea:focus {
        border-color: #888;
    }

    .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 12px;
        flex-wrap: wrap;
    }

    button {
        border: 1px solid #333;
        border-radius: 4px;
        padding: 8px 14px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #333;
    }

    button:hover {
        background: #222;
    }

    .hint {
        color: #777;
        font-size: 12px;
    }

    .status {
        display: grid;
        gap: 14px;
        align-content: start;
    }

    .pill {
        display: inline-block;
        width: fit-content;
        padding: 5px 9px;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 600;
        background: #eee;
        color: #555;
    }

    .pill.ready {
        color: #176b2c;
        background: #e8f5e9;
    }

    .pill.error {
        color: #9a4d00;
        background: #fff3e0;
    }

    .result {
        font-size: 20px;
        font-weight: 600;
        color: #222;
        margin-top: 4px;
    }

    .raw {
        color: #666;
        font-size: 12px;
        line-height: 1.5;
        margin-top: 5px;
    }

    .error-box {
        padding: 10px 12px;
        border: 1px solid #e5b7b7;
        border-radius: 4px;
        background: #fff5f5;
        color: #9b3333;
        font-size: 12px;
        line-height: 1.5;
    }

    .footer {
        margin-top: 18px;
        color: #777;
        font-size: 12px;
    }

    .footer a {
        color: #333 !important;
    }

    @media (max-width: 700px) {
        .grid {
            grid-template-columns: 1fr;
        }

        .shell {
            width: 94%;
            padding: 20px 0;
        }

        h1 {
            font-size: 22px;
        }
    }
</style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <div class="eyebrow">Movie Sentiment Analysis</div>
            
        </section>

        <section class="grid">
            <div class="card">
                <form method="post" action="/predict">
                    <label for="text">Review text</label>
                    <textarea id="text" name="text" placeholder="Type a movie review here...">{{ input_text or "" }}</textarea>
                    <div class="actions">
                        <button type="submit">Predict sentiment</button>
                       
                        
                    </div>
                </form>
            </div>

            <aside class="card status">
                <!-- {% if model_ready %}
                    <div class="pill ready">Model ready</div>
                {% else %}
                    <div class="pill error">Model not ready</div>
                {% endif %} -->

                {% if result %}
                    <div>
                        <div class="hint">Prediction</div>
                        <div class="result">{{ result }}</div>
                        <!-- {% if raw_prediction is not none %}
                            <div class="raw">Raw output: {{ raw_prediction }}</div>
                        {% endif %} -->
                    <!-- </div>
                {% endif %}

                {% if cleaned_text %}
                    <div>
                        <div class="hint">Cleaned text</div>
                        <div class="raw">{{ cleaned_text }}</div>
                    </div>
                {% endif %} -->

                {% if startup_error %}
                    <div class="error-box">{{ startup_error }}</div>
                {% endif %}
            </aside>
        </section>

        <div class="footer">
            Metrics: <a href="/metrics" style="color: var(--accent);">/metrics</a> | Health: <a href="/health" style="color: var(--accent);">/health</a>
        </div>
    </main>
</body>
</html>
